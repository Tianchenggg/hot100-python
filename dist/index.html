<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="支持 ACM 与 LeetCode 双模式的 Python Hot 100 在线刷题网站，打开浏览器即可写题、调试与判题。">
  <title>Hot 100</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/codemirror/lib/codemirror.css">
  <script src="./skins.js?v=11"></script>
  <link rel="stylesheet" href="./styles.css?v=10">
  <link rel="stylesheet" href="./skins.css?v=11">
</head>
<body>
  <div class="app-shell" id="appShell">
    <nav class="app-rail" aria-label="导航">
      <button class="icon-button rail-home" id="homeButton" aria-label="主页" aria-current="page" title="主页"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 2.8a2 2 0 0 1 2.4 0l8 6.2a1.25 1.25 0 0 1-.77 2.24H20V20a1 1 0 0 1-1 1h-5v-6a2 2 0 0 0-4 0v6H5a1 1 0 0 1-1-1v-8.76h-.43A1.25 1.25 0 0 1 2.8 9Z"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-8 9 8v11h-7v-7h-4v7H3Z"/></svg></button>
      <button class="icon-button skin-trigger" id="skinButton" aria-label="设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="skinPanel" title="设置"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.3-2 .9-2.2-.5-2 3.5 1.5 1.8v2l-1.5 1.8 2 3.5 2.2-.5 2 .9.7 2.3h5l.7-2.3 2-.9 2.2.5 2-3.5-1.5-1.8v-2l1.5-1.8-2-3.5-2.2.5-2-.9-.7-2.3Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v3l2 1 2.5-1.5 3 5-2.5 1.5v2l2.5 1.5-3 5L17 19l-2 1v3H9v-3l-2-1-2.5 1.5-3-5L4 14v-2L1.5 10.5l3-5L7 7l2-1Z" transform="translate(1 0) scale(.92)"/><path d="M9 9h6v6H9Z"/></svg></button>
      <a class="rail-github" id="repoLink" href="https://github.com/Tianchenggg/hot100-python" target="_blank" rel="noreferrer" aria-label="GitHub 源码" title="GitHub 源码"><svg viewBox="0 0 24 24"><path d="M9 19c-4 1-4-2-6-2m12 5v-4a3.5 3.5 0 0 0-1-3c3 0 6-1.5 6-6a4.6 4.6 0 0 0-1-3c.4-1 .4-2-.1-3 0 0-1.1-.3-3.4 1a12 12 0 0 0-7 0C6.2 2.7 5 3 5 3c-.5 1-.5 2-.1 3a4.6 4.6 0 0 0-1 3c0 4.5 3 6 6 6a3.5 3.5 0 0 0-1 3v4"/></svg></a>
    </nav>
    <aside class="sidebar" id="sidebar" aria-label="题目列表">
      <div class="sidebar-head">
        <div class="mode-switch">
          <button class="mode-button" id="modeButton" aria-haspopup="menu" aria-expanded="false" aria-controls="modeMenu"><span id="modeLabel">ACM 模式</span><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5M7 17h10"/></svg></button>
          <div class="mode-menu" id="modeMenu" role="menu" aria-label="刷题模式" hidden>
            <button class="mode-option" role="menuitemradio" aria-checked="true" data-mode="acm" tabindex="-1">ACM 模式</button>
            <button class="mode-option" role="menuitemradio" aria-checked="false" data-mode="leetcode" tabindex="-1">LeetCode 模式</button>
          </div>
        </div>
        <button class="icon-button" id="searchButton" aria-label="搜索题目" aria-expanded="false" aria-controls="searchField" title="搜索题目"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h7l4 4v7l-4 4H8l-4-4V8Zm9 13 4 4"/></svg></button>
      </div>
      <label class="search-field" id="searchField" hidden><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h7l4 4v7l-4 4H8l-4-4V8Zm9 13 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索题目" aria-label="搜索题号、标题或知识点" autocomplete="off"></label>
      <div class="sidebar-section-label">题目<span>100</span></div>
      <div class="problem-list" id="problemList"><div class="empty-result">正在加载…</div></div>
      <div class="sidebar-footer"><span id="progressText">0 / 100 已通过</span><button class="icon-button skin-trigger skin-mobile-trigger" id="skinMobileButton" aria-label="设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="skinPanel" title="设置"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.3-2 .9-2.2-.5-2 3.5 1.5 1.8v2l-1.5 1.8 2 3.5 2.2-.5 2 .9.7 2.3h5l.7-2.3 2-.9 2.2.5 2-3.5-1.5-1.8v-2l1.5-1.8-2-3.5-2.2.5-2-.9-.7-2.3Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v3l2 1 2.5-1.5 3 5-2.5 1.5v2l2.5 1.5-3 5L17 19l-2 1v3H9v-3l-2-1-2.5 1.5-3-5L4 14v-2L1.5 10.5l3-5L7 7l2-1Z" transform="translate(1 0) scale(.92)"/><path d="M9 9h6v6H9Z"/></svg></button></div>
    </aside>
    <div id="sidebarResizer" class="layout-resizer sidebar-resizer" role="separator" aria-label="调整题目列表宽度" aria-controls="sidebar" aria-orientation="vertical" tabindex="0" title="拖动调整宽度，双击恢复"></div>
    <button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="关闭题目列表" tabindex="-1" aria-hidden="true"></button>
    <main class="workspace">
      <header class="workspace-header">
        <div class="header-actions workspace-heading"><button class="icon-button sidebar-toggle" id="openSidebar" aria-label="展开题目列表" title="展开题目列表"><svg class="skin-icon-codex" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3ZM9 4v16M5 8h2M5 12h2"/></svg></button><span id="workspaceTitle"></span></div>
        <div class="header-actions"><button class="button button-run" id="runButton" title="运行（⌘ / Ctrl + Enter）"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 6 6-6 6m9 0h5"/></svg><span>运行</span></button><button class="button button-primary" id="submitButton" title="提交（⌘ / Ctrl + Shift + Enter）"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6m-5 5 5-5 5 5"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="m8 12 3 3 5-6"/></svg><span>提交</span></button><button class="button" id="stopButton" hidden>停止</button></div>
      </header>
      <div class="workspace-body">
      <section class="statement-pane" id="statementPane" aria-label="题目">
        <header class="pane-header"><span class="pane-title"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l4 4v14H4V3Zm7 0v5h5M8 12h8M8 16h6"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>题目</span><div class="header-actions"><button class="icon-button" id="prevProblem" aria-label="上一题" title="上一题"><svg class="skin-icon-codex" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button><button class="icon-button" id="nextProblem" aria-label="下一题" title="下一题"><svg class="skin-icon-codex" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></div></header>
        <div class="statement-content" id="statementContent"><div class="empty-result">正在加载题目…</div></div>
      </section>
      <div id="statementResizer" class="layout-resizer statement-resizer" role="separator" aria-label="调整题目与代码区宽度" aria-controls="statementPane codingPane" aria-orientation="vertical" tabindex="0" title="拖动调整宽度，双击恢复"></div>
      <section class="coding-pane" id="codingPane" aria-label="Python 代码">
        <header class="pane-header"><span class="pane-title filename"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 6 6-6 6m9 0h7"/></svg>main.py</span><div class="editor-tools" id="editorTools" hidden><div class="font-size-control" role="group" aria-label="代码字号"><button id="fontDecrease" aria-label="减小代码字号" title="减小字号">A−</button><output id="fontSizeValue" aria-label="代码字号" aria-live="polite">14</output><button id="fontIncrease" aria-label="增大代码字号" title="增大字号">A+</button></div><button id="wrapCode" class="wrap-button" aria-label="自动换行" title="自动换行" aria-pressed="true"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 11h12a4 4 0 0 1 0 8h-5m3-3-3 3 3 3M4 16h3"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16v8H9m4-4-4 4 4 4M4 15h2"/></svg><span>换行</span></button></div><span class="runtime-label">Python 3</span></header>
        <div class="editor-wrap"><textarea id="codeEditor" aria-label="Python 代码编辑器" spellcheck="false"></textarea></div>
        <div class="editor-footer"><span id="cursorPosition">第 1 行，第 1 列</span><span class="saved-label" id="saveStatus" role="status">已保存到此浏览器</span></div>
        <section class="test-panel" id="testPanel" aria-label="测试与结果">
          <div class="panel-resizer" id="panelResizer" role="separator" aria-label="调整测试面板高度" aria-orientation="horizontal" tabindex="0"></div>
          <div class="panel-header"><div class="panel-tabs" role="tablist"><button id="inputTab" class="active" role="tab" aria-selected="true" aria-controls="inputView">测试用例</button><button id="resultTab" role="tab" aria-selected="false" aria-controls="resultView">结果<span id="resultIndicator"></span></button></div><button class="icon-button" id="panelToggle" aria-label="收起测试面板" aria-expanded="true"><svg class="skin-icon-codex" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 8v12m-5-5 5 5 5-5"/></svg></button></div>
          <div class="panel-body" id="panelBody">
            <div class="test-input-view" id="inputView" role="tabpanel" aria-labelledby="inputTab"><div class="case-tabs" id="caseTabs"></div><div class="test-fields"><label class="field"><span>输入</span><textarea id="testInput" aria-label="测试输入" spellcheck="false"></textarea></label><label class="field"><span>期望输出 <small id="expectedOptional" hidden>可选</small></span><textarea id="expectedOutput" aria-label="期望输出" spellcheck="false"></textarea></label></div></div>
            <div class="test-result-view" id="resultView" role="tabpanel" aria-labelledby="resultTab" hidden><div class="empty-result">运行代码后查看结果</div></div>
          </div>
        </section>
      </section>
      </div>
    </main>
  </div>
  <section class="skin-panel" id="skinPanel" role="dialog" aria-labelledby="skinTitle" hidden>
    <div class="skin-panel-head"><h2 id="skinTitle">设置</h2><button class="icon-button" id="closeSkinPanel" aria-label="关闭设置"><svg class="skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg><svg class="skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Zm4 4 8 8m0-8-8 8"/></svg></button></div>
    <div class="skin-options" role="radiogroup" aria-label="界面皮肤">
        <button class="skin-option" data-skin-option="codex" role="radio" aria-checked="true" tabindex="0">
          <span class="skin-logo logo-codex" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12ZM16 13.5C16.5523 13.5 17 13.9477 17 14.5C17 15.0523 16.5523 15.5 16 15.5H13C12.4477 15.5 12 15.0523 12 14.5C12 13.9477 12.4477 13.5 13 13.5H16ZM7.98535 8.64258C8.42937 8.37617 8.99745 8.49427 9.30078 8.90039L9.35742 8.98535L10.8574 11.4854L10.9199 11.6074C11.0269 11.858 11.0269 12.142 10.9199 12.3926L10.8574 12.5146L9.35742 15.0146C9.07324 15.4881 8.45888 15.6415 7.98535 15.3574C7.51188 15.0732 7.35846 14.4589 7.64258 13.9854L8.83301 12L7.64258 10.0146L7.59473 9.92383C7.37931 9.46516 7.54152 8.90898 7.98535 8.64258ZM22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" fill="currentColor"></path></svg></span>
          <span class="skin-option-label">Codex<svg class="skin-check skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><svg class="skin-check skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3Zm4 9 4 4 6-8"/></svg></span>
        </button>
        <button class="skin-option" data-skin-option="claude" role="radio" aria-checked="false" tabindex="-1">
          <span class="skin-logo logo-claude" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 125" fill="none" aria-hidden="true" focusable="false"><path d="M54.375 118.75L56.125 111L58.125 101L59.75 93L61.25 83.125L62.125 79.875L62 79.625L61.375 79.75L53.875 90L42.5 105.375L33.5 114.875L31.375 115.75L27.625 113.875L28 110.375L30.125 107.375L42.5 91.5L50 81.625L54.875 76L54.75 75.25H54.5L21.5 96.75L15.625 97.5L13 95.125L13.375 91.25L14.625 90L24.5 83.125L49.125 69.375L49.5 68.125L49.125 67.5H47.875L43.75 67.25L29.75 66.875L17.625 66.375L5.75 65.75L2.75 65.125L0 61.375L0.25 59.5L2.75 57.875L6.375 58.125L14.25 58.75L26.125 59.5L34.75 60L47.5 61.375H49.5L49.75 60.5L49.125 60L48.625 59.5L36.25 51.25L23 42.5L16 37.375L12.25 34.75L10.375 32.375L9.625 27.125L13 23.375L17.625 23.75L18.75 24L23.375 27.625L33.25 35.25L46.25 44.875L48.125 46.375L49 45.875V45.5L48.125 44.125L41.125 31.375L33.625 18.375L30.25 13L29.375 9.75C29.0417 8.625 28.875 7.375 28.875 6L32.75 0.750006L34.875 0L40.125 0.750006L42.25 2.625L45.5 10L50.625 21.625L58.75 37.375L61.125 42.125L62.375 46.375L62.875 47.75H63.75V47L64.375 38L65.625 27.125L66.875 13.125L67.25 9.125L69.25 4.375L73.125 1.87501L76.125 3.25L78.625 6.875L78.25 9.125L76.875 18.75L73.875 33.875L72 44.125H73.125L74.375 42.75L79.5 36L88.125 25.25L91.875 21L96.375 16.25L99.25 14H104.625L108.5 19.875L106.75 26L101.25 33L96.625 38.875L90 47.75L86 54.875L86.375 55.375H87.25L102.125 52.125L110.25 50.75L119.75 49.125L124.125 51.125L124.625 53.125L122.875 57.375L112.625 59.875L100.625 62.25L82.75 66.5L82.5 66.625L82.75 67L90.75 67.75L94.25 68H102.75L118.5 69.125L122.625 71.875L125 75.125L124.625 77.75L118.25 80.875L109.75 78.875L89.75 74.125L83 72.5H82V73L87.75 78.625L98.125 88L111.25 100.125L111.875 103.125L110.25 105.625L108.5 105.375L97 96.625L92.5 92.75L82.5 84.375H81.875V85.25L84.125 88.625L96.375 107L97 112.625L96.125 114.375L92.875 115.5L89.5 114.875L82.25 104.875L74.875 93.5L68.875 83.375L68.25 83.875L64.625 121.62           <span class="skin-option-label">Claude Code<svg class="skin-check skin-icon-codex" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><svg class="skin-check skin-icon-claude" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3Zm4 9 4 4 6-8"/></svg></span>
        </button>
    </div>
  </section>
  <span id="skinStatus" class="skin-status" role="status"></span>
  <script src="./vendor/codemirror/lib/codemirror.js"></script>
  <script src="./vendor/codemirror/mode/python/python.js"></script>
  <script src="./vendor/codemirror/addon/edit/matchbrackets.js"></script>
  <script type="module" src="./app.js?v=11"></script>
</body>
</html>
