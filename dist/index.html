<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Hot 100 · Python 在线刷题">
  <title>Hot 100</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <div class="app-shell" id="appShell">
    <nav class="app-rail" aria-label="导航">
      <button class="icon-button rail-home" id="homeButton" aria-label="主页" aria-current="page" title="主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 2.8a2 2 0 0 1 2.4 0l8 6.2a1.25 1.25 0 0 1-.77 2.24H20V20a1 1 0 0 1-1 1h-5v-6a2 2 0 0 0-4 0v6H5a1 1 0 0 1-1-1v-8.76h-.43A1.25 1.25 0 0 1 2.8 9Z"/></svg></button>
      <a class="rail-github" id="repoLink" href="https://github.com/Tianchenggg/hot100-python" target="_blank" rel="noreferrer" aria-label="GitHub 源码" title="GitHub 源码"><svg viewBox="0 0 24 24"><path d="M9 19c-4 1-4-2-6-2m12 5v-4a3.5 3.5 0 0 0-1-3c3 0 6-1.5 6-6a4.6 4.6 0 0 0-1-3c.4-1 .4-2-.1-3 0 0-1.1-.3-3.4 1a12 12 0 0 0-7 0C6.2 2.7 5 3 5 3c-.5 1-.5 2-.1 3a4.6 4.6 0 0 0-1 3c0 4.5 3 6 6 6a3.5 3.5 0 0 0-1 3v4"/></svg></a>
    </nav>
    <aside class="sidebar" id="sidebar" aria-label="题目列表">
      <div class="sidebar-head">
        <div class="mode-switch">
          <button class="mode-button" id="modeButton" aria-haspopup="menu" aria-expanded="false" aria-controls="modeMenu"><span id="modeLabel">ACM 模式</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
          <div class="mode-menu" id="modeMenu" role="menu" aria-label="刷题模式" hidden>
            <button class="mode-option" role="menuitemradio" aria-checked="true" data-mode="acm" tabindex="-1">ACM 模式</button>
            <button class="mode-option" role="menuitemradio" aria-checked="false" data-mode="leetcode" tabindex="-1">LeetCode 模式</button>
          </div>
        </div>
        <button class="icon-button" id="searchButton" aria-label="搜索题目" aria-expanded="false" aria-controls="searchField" title="搜索题目"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg></button>
      </div>
      <label class="search-field" id="searchField" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索题目" aria-label="搜索题号、标题或知识点" autocomplete="off"></label>
      <div class="sidebar-section-label">题目<span>100</span></div>
      <div class="problem-list" id="problemList"><div class="empty-result">正在加载…</div></div>
      <div class="sidebar-footer"><span id="progressText">0 / 100 已通过</span></div>
    </aside>
    <div id="sidebarResizer" class="layout-resizer sidebar-resizer" role="separator" aria-label="调整题目列表宽度" aria-controls="sidebar" aria-orientation="vertical" tabindex="0" title="拖动调整宽度，双击恢复"></div>
    <button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="关闭题目列表" tabindex="-1" aria-hidden="true"></button>
    <main class="workspace">
      <header class="workspace-header">
        <div class="header-actions workspace-heading"><button class="icon-button sidebar-toggle" id="openSidebar" aria-label="展开题目列表" title="展开题目列表"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><span id="workspaceTitle"></span></div>
        <div class="header-actions"><button class="button button-run" id="runButton" title="运行（⌘ / Ctrl + Enter）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>运行</span></button><button class="button button-primary" id="submitButton" title="提交（⌘ / Ctrl + Shift + Enter）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6m-5 5 5-5 5 5"/></svg><span>提交</span></button><button class="button" id="stopButton" hidden>停止</button></div>
      </header>
      <div class="workspace-body">
      <section class="statement-pane" id="statementPane" aria-label="题目">
        <header class="pane-header"><span class="pane-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l4 4v14H4V3Zm7 0v5h5M8 12h8M8 16h6"/></svg>题目</span><div class="header-actions"><button class="icon-button" id="prevProblem" aria-label="上一题" title="上一题"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button class="icon-button" id="nextProblem" aria-label="下一题" title="下一题"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></div></header>
        <div class="statement-content" id="statementContent"><div class="empty-result">正在加载题目…</div></div>
      </section>
      <div id="statementResizer" class="layout-resizer statement-resizer" role="separator" aria-label="调整题目与代码区宽度" aria-controls="statementPane codingPane" aria-orientation="vertical" tabindex="0" title="拖动调整宽度，双击恢复"></div>
      <section class="coding-pane" id="codingPane" aria-label="Python 代码">
        <header class="pane-header"><span class="pane-title filename"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg>main.py</span><div class="editor-tools" id="editorTools" hidden><div class="font-size-control" role="group" aria-label="代码字号"><button id="fontDecrease" aria-label="减小代码字号" title="减小字号">A−</button><output id="fontSizeValue" aria-label="代码字号" aria-live="polite">14</output><button id="fontIncrease" aria-label="增大代码字号" title="增大字号">A+</button></div><button id="wrapCode" class="wrap-button" aria-label="自动换行" title="自动换行" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 11h12a4 4 0 0 1 0 8h-5m3-3-3 3 3 3M4 16h3"/></svg><span>换行</span></button></div><span class="runtime-label">Python 3</span></header>
        <div class="editor-wrap"><textarea id="codeEditor" aria-label="Python 代码编辑器" spellcheck="false"></textarea></div>
        <div class="editor-footer"><span id="cursorPosition">第 1 行，第 1 列</span><span class="saved-label" id="saveStatus" role="status">已保存到此浏览器</span></div>
        <section class="test-panel" id="testPanel" aria-label="测试与结果">
          <div class="panel-resizer" id="panelResizer" role="separator" aria-label="调整测试面板高度" aria-orientation="horizontal" tabindex="0"></div>
          <div class="panel-header"><div class="panel-tabs" role="tablist"><button id="inputTab" class="active" role="tab" aria-selected="true" aria-controls="inputView">测试用例</button><button id="resultTab" role="tab" aria-selected="false" aria-controls="resultView">结果<span id="resultIndicator"></span></button></div><button class="icon-button" id="panelToggle" aria-label="收起测试面板" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button></div>
          <div class="panel-body" id="panelBody">
            <div class="test-input-view" id="inputView" role="tabpanel" aria-labelledby="inputTab"><div class="case-tabs" id="caseTabs"></div><div class="test-fields"><label class="field"><span>输入</span><textarea id="testInput" aria-label="测试输入" spellcheck="false"></textarea></label><label class="field"><span>期望输出 <small>可选</small></span><textarea id="expectedOutput" aria-label="期望输出" spellcheck="false"></textarea></label></div></div>
            <div class="test-result-view" id="resultView" role="tabpanel" aria-labelledby="resultTab" hidden><div class="empty-result">运行代码后查看结果</div></div>
          </div>
        </section>
      </section>
      </div>
    </main>
  </div>
  <script src="./vendor/codemirror/lib/codemirror.js"></script>
  <script src="./vendor/codemirror/mode/python/python.js"></script>
  <script src="./vendor/codemirror/addon/edit/matchbrackets.js"></script>
  <script type="module" src="./app.js?v=6"></script>
</body>
</html>
