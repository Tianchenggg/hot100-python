<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hot 100 Python</title>
  <desc id="desc">100 problems. Two modes. One focused workspace.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f5ff"/><stop offset=".55" stop-color="#f5f1ff"/><stop offset="1" stop-color="#e9f8f6"/></linearGradient>
    <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#3d5cdb"/><stop offset="1" stop-color="#7653c9"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6578a9" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="54" y="51" width="58" height="58" rx="17" fill="url(#ink)"/>
    <path d="m77 69-11 11 11 11m13-22 11 11-11 11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="89" font-size="16" letter-spacing="3" font-weight="600" fill="#647194">WRITE. RUN. REFINE.</text>
    <text x="52" y="175" font-size="62" font-weight="750" letter-spacing="-2.5" fill="#182541">Hot 100 <tspan fill="url(#ink)">Python</tspan></text>
    <text x="55" y="220" font-size="21" fill="#5f6c83">100 problems. Two modes. One focused workspace.</text>
    <g transform="translate(830 55)">
      <rect width="313" height="192" rx="15" fill="white" fill-opacity=".85" stroke="#dbe2f0"/>
      <path d="M0 39h313" stroke="#e5e8f2"/>
      <circle cx="20" cy="20" r="4" fill="#ccd3e2"/><circle cx="34" cy="20" r="4" fill="#ccd3e2"/><circle cx="48" cy="20" r="4" fill="#ccd3e2"/>
      <text x="242" y="25" font-size="12" fill="#8190a6">main.py</text>
      <g font-family="'SFMono-Regular',Consolas,monospace" font-size="16">
        <text x="24" y="77" fill="#7653c9">class <tspan fill="#326393">Solution</tspan><tspan fill="#23314c">:</tspan></text>
        <text x="24" y="107" fill="#23314c" xml:space="preserve">    <tspan fill="#7653c9">def</tspan> <tspan fill="#326393">solve</tspan>(self):</text>
        <text x="24" y="137" fill="#23314c" xml:space="preserve">        <tspan fill="#7653c9">return</tspan> answer</text>
      </g>
      <rect x="24" y="157" width="65" height="21" rx="6" fill="#e5f5eb"/>
      <text x="36" y="172" font-size="11" fill="#23834c" font-weight="600">✓ PASS</text>
      <text x="178" y="172" font-size="11" letter-spacing="1" fill="#8190a6">ACM / LEETCODE</text>
    </g>
  </g>
</svg>
